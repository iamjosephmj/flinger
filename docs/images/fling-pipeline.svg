<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="Helvetica,Arial,sans-serif">
<rect width="780" height="460" fill="#ffffff"/>
<text x="390.0" y="30.0" font-size="17" font-weight="bold" text-anchor="middle" fill="#24292f" >How one frame of a fling is computed</text>
<rect x="40.0" y="78.0" width="260.0" height="74.0" fill="#dbeafe" fill-opacity="1.0"/>
<rect x="40" y="78" width="260" height="74" fill="none" stroke="#0969da" stroke-width="1.4" rx="8"/>
<text x="170.0" y="101.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#24292f" >FlingConfiguration</text>
<text x="170.0" y="120.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >10 physics &amp; spline parameters</text>
<text x="170.0" y="139.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >(you control these)</text>
<rect x="370.0" y="78.0" width="230.0" height="74.0" fill="#f6f8fa" fill-opacity="1.0"/>
<rect x="370" y="78" width="230" height="74" fill="none" stroke="#d0d7de" stroke-width="1.4" rx="8"/>
<text x="485.0" y="101.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#24292f" >Density</text>
<text x="485.0" y="120.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >screen density, e.g. 2.625</text>
<text x="485.0" y="139.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >(from LocalDensity)</text>
<rect x="150.0" y="216.0" width="360.0" height="74.0" fill="#dbeafe" fill-opacity="1.0"/>
<rect x="150" y="216" width="360" height="74" fill="none" stroke="#0969da" stroke-width="1.4" rx="8"/>
<text x="330.0" y="239.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#24292f" >FlingCalculator</text>
<text x="330.0" y="258.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >duration T and total distance D</text>
<text x="330.0" y="277.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >for the initial velocity v₀</text>
<rect x="60.0" y="352.0" width="250.0" height="74.0" fill="#dbeafe" fill-opacity="1.0"/>
<rect x="60" y="352" width="250" height="74" fill="none" stroke="#0969da" stroke-width="1.4" rx="8"/>
<text x="185.0" y="375.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#24292f" >AndroidFlingSpline</text>
<text x="185.0" y="394.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >precomputed lookup table</text>
<text x="185.0" y="413.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >of numberOfSplinePoints samples</text>
<rect x="430.0" y="352.0" width="290.0" height="74.0" fill="#e7f6ec" fill-opacity="1.0"/>
<rect x="430" y="352" width="290" height="74" fill="none" stroke="#1a7f37" stroke-width="1.4" rx="8"/>
<text x="575.0" y="375.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#24292f" >Every animation frame</text>
<text x="575.0" y="394.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >position(t) = D · spline(t / T)</text>
<text x="575.0" y="413.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" >velocity(t) = spline′(t / T) · D / T</text>
<line x1="250.0" y1="152.0" x2="290.0" y2="214.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="290.0" y1="214.0" x2="298.1" y2="218.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="290.0" y1="214.0" x2="290.3" y2="223.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="470.0" y1="152.0" x2="430.0" y2="214.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="430.0" y1="214.0" x2="429.7" y2="223.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="430.0" y1="214.0" x2="421.9" y2="218.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="240.0" y1="290.0" x2="200.0" y2="350.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="200.0" y1="350.0" x2="199.6" y2="359.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="200.0" y1="350.0" x2="191.9" y2="353.8" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<text x="220.0" y="311.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#57606a" >built once per configuration</text>
<line x1="430.0" y1="290.0" x2="500.0" y2="350.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="500.0" y1="350.0" x2="508.9" y2="351.5" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="500.0" y1="350.0" x2="502.8" y2="358.5" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="310.0" y1="389.0" x2="430.0" y2="389.0" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="430.0" y1="389.0" x2="437.7" y2="384.4" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="430.0" y1="389.0" x2="437.7" y2="393.6" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
<text x="370.0" y="380.0" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#57606a" >coefficient lookup</text>
</svg>